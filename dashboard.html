<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Owner Dashboard - Vehicle Owner Connect</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

.container{
  max-width:800px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  margin-top:25px;
  padding:24px;
  border-radius:18px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}

input,button{
  width:100%;
  padding:13px;
  margin-top:10px;
  border-radius:10px;
  font-size:16px;
}

input{
  border:1px solid #d0d5dd;
}

button{
  border:0;
  background:#172033;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.hidden{
  display:none;
}

.error{
  color:#b42318;
  margin-top:15px;
  font-weight:bold;
}

.success{
  color:#067647;
  margin-top:15px;
  font-weight:bold;
}

.vehicle{
  background:#f8fafc;
  padding:16px;
  border-radius:12px;
  margin:15px 0;
}

.message{
  border:1px solid #e4e7ec;
  border-radius:14px;
  padding:18px;
  margin-top:15px;
}

.message.new{
  border-left:5px solid #067647;
}

.message.read{
  border-left:5px solid #98a2b3;
  opacity:.85;
}

.meta{
  color:#667085;
  font-size:14px;
  margin-top:7px;
}

.message-text{
  margin-top:14px;
  white-space:pre-wrap;
}

.logout{
  background:#b42318;
}

.status-button{
  margin-top:14px;
}

.read-button{
  background:#98a2b3;
}

.qr-button{
  background:#067647;
}

.qr-box{
  margin-top:18px;
  padding:18px;
  border:1px solid #e4e7ec;
  border-radius:14px;
  text-align:center;
  background:white;
}

.qr-image{
  width:220px;
  max-width:100%;
  display:block;
  margin:15px auto;
}

.qr-url{
  font-size:12px;
  color:#667085;
  word-break:break-all;
  background:#f2f4f7;
  padding:10px;
  border-radius:8px;
}

.print-button{
  background:#344054;
}
</style>
</head>

<body>

<div class="container">

<div id="loginCard" class="card">

<h1>🔐 Owner Login</h1>

<p>Vehicle Owner Connect</p>

<input
id="email"
type="email"
placeholder="Owner email"
value="Somendra050698@gmail.com"
>

<input
id="password"
type="password"
placeholder="Password"
>

<button id="loginButton">
Login
</button>

<p id="loginStatus"></p>

</div>


<div id="dashboard" class="hidden">

<div class="card">

<button
id="logoutButton"
class="logout">
Logout
</button>

<h1>📬 Owner Dashboard</h1>

<p>Welcome, Somendra Singh</p>

<div id="vehicles">
Loading vehicle...
</div>

</div>


<div class="card">

<h2>📨 Received Messages</h2>

<div id="messages">
Loading messages...
</div>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://aythnjldktpqeslkrzyg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_IZlTlBdcGcfKQ2RsU_F8yA_1NNv61oq";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const loginCard =
document.getElementById("loginCard");

const dashboard =
document.getElementById("dashboard");

const loginButton =
document.getElementById("loginButton");

const logoutButton =
document.getElementById("logoutButton");

const loginStatus =
document.getElementById("loginStatus");

const vehiclesBox =
document.getElementById("vehicles");

const messagesBox =
document.getElementById("messages");


/* LOGIN */

loginButton.addEventListener(
"click",
async function(){

const email =
document.getElementById("email")
.value
.trim();

const password =
document.getElementById("password")
.value;

if(!email || !password){

loginStatus.className="error";

loginStatus.textContent =
"Please enter email and password.";

return;
}

loginButton.disabled=true;

loginButton.textContent="Logging in...";


const {error} =
await supabaseClient.auth
.signInWithPassword({
email:email,
password:password
});


if(error){

console.error(error);

loginStatus.className="error";

loginStatus.textContent =
"Login failed. Check your email and password.";

loginButton.disabled=false;

loginButton.textContent="Login";

return;
}

loginStatus.className="";

loginStatus.textContent="";

loginButton.disabled=false;

loginButton.textContent="Login";

await showDashboard();

});


/* SHOW DASHBOARD */

async function showDashboard(){

loginCard.classList.add("hidden");

dashboard.classList.remove("hidden");

await loadVehicles();

await loadMessages();

}


/* LOAD VEHICLES */

async function loadVehicles(){

const {data,error} =
await supabaseClient
.from("vehicles")
.select(
"id,vehicle_number,owner_name,status,qr_token"
)
.order(
"created_at",
{ascending:false}
);


if(error){

console.error(error);

vehiclesBox.innerHTML =
'<p class="error">Unable to load vehicle.</p>';

return;
}


if(!data || data.length===0){

vehiclesBox.innerHTML =
"<p>No vehicle found.</p>";

return;
}


vehiclesBox.innerHTML="";


data.forEach(function(vehicle){

const box =
document.createElement("div");

box.className="vehicle";

box.innerHTML =
"<strong>Vehicle:</strong> "+
escapeHtml(vehicle.vehicle_number)+
"<br><br>"+
"<strong>Owner:</strong> "+
escapeHtml(vehicle.owner_name)+
"<br><br>"+
"<strong>Status:</strong> "+
escapeHtml(vehicle.status);


const qrButton =
document.createElement("button");

qrButton.className="qr-button";

qrButton.textContent="📱 Generate QR";


qrButton.onclick=function(){

generateQR(vehicle,box);

};


box.appendChild(qrButton);

vehiclesBox.appendChild(box);

});

}


/* GENERATE QR */

function generateQR(vehicle,box){

if(!vehicle.qr_token){

alert(
"QR token is missing for this vehicle."
);

return;
}


/*
IMPORTANT:
QR points directly to index.html
and sends the vehicle token.
*/

const baseUrl =
"https://somendra050698-crypto.github.io/vehicle-owner-connect/index.html";


const token =
String(vehicle.qr_token).trim();


const qrUrl =
baseUrl+
"?token="+
encodeURIComponent(token);


/* DEBUG */

console.log("Vehicle:",vehicle.vehicle_number);

console.log("QR Token:",token);

console.log("QR URL:",qrUrl);


const oldQR =
box.querySelector(".qr-box");

if(oldQR){
oldQR.remove();
}


const qrBox =
document.createElement("div");

qrBox.className="qr-box";


qrBox.innerHTML =
"<h3>🚗 "+
escapeHtml(vehicle.vehicle_number)+
"</h3>"+

'<img class="qr-image" alt="Vehicle QR Code">'+

'<div class="qr-url">'+
escapeHtml(qrUrl)+
"</div>";


const image =
qrBox.querySelector(".qr-image");


image.src =
"https://api.qrserver.com/v1/create-qr-code/?size=500x500&data="+
encodeURIComponent(qrUrl);


/* DOWNLOAD */

const download =
document.createElement("button");

download.className="qr-button";

download.textContent="⬇️ Download QR";


download.onclick=function(){

const link =
document.createElement("a");

link.href=image.src;

link.target="_blank";

link.download=
"vehicle-"+
vehicle.vehicle_number+
"-QR.png";

document.body.appendChild(link);

link.click();

link.remove();

};


/* PRINT */

const print =
document.createElement("button");

print.className="print-button";

print.textContent="🖨️ Print QR";


print.onclick=function(){

const win =
window.open("","_blank");

if(!win){

alert(
"Please allow pop-ups to print the QR."
);

return;
}


win.document.write(

"<html>"+
"<head>"+
"<title>Vehicle QR</title>"+
"</head>"+

"<body style='text-align:center;font-family:Arial'>"+

"<h2>Vehicle Owner Connect</h2>"+

"<h3>"+
escapeHtml(vehicle.vehicle_number)+
"</h3>"+

"<img src='"+
image.src+
"' style='width:400px;max-width:90%'>"+

"<p style='font-size:12px;word-break:break-all'>"+
escapeHtml(qrUrl)+
"</p>"+

"</body>"+
"</html>"

);

win.document.close();

win.focus();

setTimeout(
function(){
win.print();
},
700
);

};


qrBox.appendChild(download);

qrBox.appendChild(print);

box.appendChild(qrBox);

}


/* LOAD MESSAGES */

async function loadMessages(){

const {data,error} =
await supabaseClient
.from("vehicle_messages")
.select(`
id,
vehicle_id,
sender_name,
sender_contact,
message,
status,
created_at,
vehicles(
vehicle_number
)
`)
.order(
"created_at",
{ascending:false}
);


if(error){

console.error(error);

messagesBox.innerHTML =
'<p class="error">Unable to load messages.</p>';

return;
}


if(!data || data.length===0){

messagesBox.innerHTML =
"<p>No messages received yet.</p>";

return;
}


messagesBox.innerHTML="";


data.forEach(function(item){

const div =
document.createElement("div");


const status =
item.status || "new";


div.className =
"message "+
(
status==="read"
?"read"
:"new"
);


const vehicle =
item.vehicles
?item.vehicles.vehicle_number
:"Vehicle";


div.innerHTML =

"<strong>🚗 "+
escapeHtml(vehicle)+
"</strong>"+

'<div class="meta">From: '+
escapeHtml(
item.sender_name || "Unknown"
)+
"</div>"+

'<div class="meta">Contact: '+
escapeHtml(
item.sender_contact || "Not provided"
)+
"</div>"+

'<div class="meta">'+
new Date(
item.created_at
).toLocaleString()+
"</div>"+

'<div class="message-text">'+
escapeHtml(item.message)+
"</div>";


const button =
document.createElement("button");


button.className="status-button";


if(status==="read"){

button.classList.add("read-button");

button.disabled=true;

button.textContent="✓ Read";

}else{

button.textContent="Mark as Read";

button.addEventListener(
"click",
function(){

markAsRead(
item.id,
button
);

});

}


div.appendChild(button);

messagesBox.appendChild(div);

});

}


/* MARK AS READ */

async function markAsRead(
messageId,
button
){

button.disabled=true;

button.textContent="Updating...";


const {error} =
await supabaseClient
.from("vehicle_messages")
.update({
status:"read"
})
.eq(
"id",
messageId
);


if(error){

console.error(error);

button.disabled=false;

button.textContent="Mark as Read";

alert(
"Unable to update message."
);

return;
}


button.classList.add("read-button");

button.textContent="✓ Read";


await loadMessages();

}


/* LOGOUT */

logoutButton.addEventListener(
"click",
async function(){

await supabaseClient.auth.signOut();

dashboard.classList.add("hidden");

loginCard.classList.remove("hidden");

});


/* SESSION */

async function checkSession(){

const {data} =
await supabaseClient.auth.getSession();


if(
data &&
data.session
){

await showDashboard();

}

}


/* ESCAPE HTML */

function escapeHtml(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* START */

checkSession();

</script>

</body>
</html>

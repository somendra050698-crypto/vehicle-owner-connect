<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vehicle Owner Connect</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .container {
      max-width: 560px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      margin-top: 30px;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
    }

    .subtitle {
      color: #667085;
    }

    .vehicle-box {
      background: #f8fafc;
      padding: 16px;
      border-radius: 12px;
      margin: 20px 0;
    }

    .privacy {
      background: #eef6ff;
      padding: 14px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea,
    button {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      font-size: 16px;
    }

    input,
    textarea {
      border: 1px solid #d0d5dd;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      margin-top: 18px;
      border: 0;
      background: #172033;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #loading {
      text-align: center;
      padding: 20px;
    }

    #error {
      color: #b42318;
      margin-top: 15px;
      font-weight: bold;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }

    .success {
      color: #067647;
    }

    .error {
      color: #b42318;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>🚗 Vehicle Owner Connect</h1>

    <p class="subtitle">
      Contact the vehicle owner privately.
    </p>

    <div id="loading">
      Loading vehicle information...
    </div>

    <div id="error"></div>

    <div id="vehicleSection" class="hidden">

      <div class="vehicle-box">
        <strong>Vehicle Number:</strong>
        <span id="vehicleNumber"></span>
        <br><br>

        <strong>Owner:</strong>
        <span id="ownerName"></span>
      </div>

      <div class="privacy">
        🔐 The owner's phone number and WhatsApp number
        are never displayed publicly.
      </div>

      <h2>Contact Owner</h2>

      <label for="senderName">
        Your Name
      </label>

      <input
        id="senderName"
        type="text"
        placeholder="Enter your name"
        maxlength="100"
      >

      <label for="senderContact">
        Your Phone / Email
      </label>

      <input
        id="senderContact"
        type="text"
        placeholder="Phone or email"
        maxlength="150"
      >

      <label for="message">
        Message
      </label>

      <textarea
        id="message"
        placeholder="Write your message..."
        maxlength="2000"
      ></textarea>

      <button id="sendButton">
        Send Private Message
      </button>

      <p id="status"></p>
